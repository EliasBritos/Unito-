<style>
  :root {
    /* El fondo tiene que ser exactamente el del logo: el logo es un JPG
       sin transparencia y cualquier diferencia se ve como un recuadro. */
    --fondo: #1b252e;
    --lima: #d9f45a;
    --lima-brillo: #ecfc9c;
    --violeta: #8b6cf6;
    --tinta-oscura: #16202a;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    background: var(--fondo);
    font-family: Montserrat, system-ui, -apple-system, 'Segoe UI', sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
  }

  .escena {
    position: relative;
    min-height: 100vh;
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }

  /* ---------------- LOGO Y CARTAS FLOTANDO ---------------- */
  .arriba {
    position: relative;
    width: 100%;
    max-width: 720px;
    height: 380px;
    display: grid;
    place-items: center;
    margin-top: 24px;
  }

  .logo {
    width: 300px;
    height: auto;
    display: block;
    position: relative;
    z-index: 1;
  }

  .carta {
    position: absolute;
    height: auto;
    filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.35));
    animation: flotar 6s ease-in-out infinite;
  }

  .c-seis    { width: 96px;  left: 12%; top: 18px;  }
  .c-uno     { width: 86px;  left: 5%;  top: 200px; animation-delay: -2s; }
  .c-cuatro  { width: 104px; right: 10%; top: 40px; animation-delay: -4s; }
  .c-colores { width: 104px; right: 5%;  top: 220px; animation-delay: -1s; }

  @keyframes flotar {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-10px) rotate(2deg); }
  }

  /* ---------------- DESTELLOS ---------------- */
  .destello {
    position: absolute;
    width: 26px;
    height: 26px;
    color: var(--violeta);
    animation: titilar 3.2s ease-in-out infinite;
  }

  @keyframes titilar {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.45; transform: scale(0.8); }
  }

  /* ---------------- EL BOTON ---------------- */
  .accion {
    position: relative;
    z-index: 2;
    margin-top: 8px;
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 0 16px;
  }

  .boton {
    position: relative;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 320px;
    padding: 20px 28px;
    border-radius: 999px;
    background: var(--lima);
    color: var(--tinta-oscura);
    font-weight: 800;
    font-size: 17px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    text-decoration: none;
    box-shadow: 0 0 0 0 rgba(217, 244, 90, 0.55), 0 12px 30px rgba(217, 244, 90, 0.18);
    animation: latir 2.4s ease-out infinite;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  /* El reflejo que cruza el boton, como en la referencia. */
  .boton::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    width: 60px;
    left: -80px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
    animation: reflejo 3s ease-in-out infinite;
  }

  .boton:hover { background: var(--lima-brillo); transform: translateY(-2px); }

  .boton:focus-visible { outline: 3px solid var(--violeta); outline-offset: 4px; }

  @keyframes latir {
    0%   { box-shadow: 0 0 0 0 rgba(217, 244, 90, 0.5), 0 12px 30px rgba(217, 244, 90, 0.18); }
    70%  { box-shadow: 0 0 0 16px rgba(217, 244, 90, 0), 0 12px 30px rgba(217, 244, 90, 0.18); }
    100% { box-shadow: 0 0 0 0 rgba(217, 244, 90, 0), 0 12px 30px rgba(217, 244, 90, 0.18); }
  }

  @keyframes reflejo {
    0%, 55% { left: -80px; }
    100%    { left: calc(100% + 20px); }
  }

  /* ---------------- EL ABANICO DE ABAJO ----------------
     Queda cortado por el borde inferior, igual que en la referencia. */
  .abanico {
    position: relative;
    margin-top: auto;
    padding-top: 40px;
    width: 340px;
    height: 190px;
    flex: none;
  }

  .abanico > * {
    position: absolute;
    bottom: -70px;
    left: 50%;
    width: 128px;
    filter: drop-shadow(0 -6px 18px rgba(0, 0, 0, 0.35));
  }

  .abanico .izq { transform: translateX(-125%) rotate(-6deg); }
  .abanico .der { transform: translateX(18%) rotate(12deg); }

  /* El dorso: un JPG no trae carta de dorso, se arma aca. */
  .dorso {
    z-index: 1;
    transform: translateX(-50%);
    height: 190px;
    border-radius: 14px;
    border: 6px solid #fff;
    background: var(--fondo);
    display: grid;
    place-items: center;
    padding-bottom: 50px;
  }

  .dorso img { width: 92px; height: auto; display: block; }

  @media (prefers-reduced-motion: reduce) {
    .carta, .destello, .boton, .boton::after { animation: none; }
  }

  /* ---------------- EN EL TELEFONO ---------------- */
  @media (max-width: 600px) {
    .arriba { height: 330px; margin-top: 10px; }
    .logo { width: 210px; }
    .c-seis    { width: 72px; left: 4%;  top: 10px; }
    .c-uno     { width: 64px; left: 2%;  top: 200px; }
    .c-cuatro  { width: 76px; right: 3%; top: 24px; }
    .c-colores { width: 76px; right: 2%; top: 200px; }
    .abanico { transform: scale(0.85); transform-origin: bottom center; }
  }
</style>
