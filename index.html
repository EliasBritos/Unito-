<style>
  :root {
    /* El fondo tiene que ser exactamente el del logo: el logo es un JPG
       sin transparencia y cualquier diferencia se ve como un recuadro. */
    --fondo: #1b252e;
    --lima: #d9f45a;
    --lima-brillo: #ecfc9c;
    --violeta: #8b6cf6;
    --tinta-oscura: #16202a;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    background: var(--fondo);
    font-family: Montserrat, system-ui, -apple-system, 'Segoe UI', sans-serif;
    /* Sin scroll: todo tiene que entrar en una pantalla. dvh descuenta
       las barras del navegador del celular; vh queda de respaldo. */
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  .escena {
    position: relative;
    height: 100vh;
    height: 100dvh;
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }

  /* ---------------- LOGO Y CARTAS FLOTANDO ---------------- */
  .arriba {
    position: relative;
    width: 100%;
    max-width: 720px;
    flex: 1 1 0;
    min-height: 0;
    display: grid;
    place-items: center;
  }

  .logo {
    width: min(300px, 56vw, 30vh);
    width: min(300px, 56vw, 30dvh);
    height: auto;
    display: block;
    position: relative;
    z-index: 1;
  }

  .carta {
    position: absolute;
    height: auto;
    filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.35));
    animation: flotar 6s ease-in-out infinite;
  }

  .c-seis    { width: min(96px, 12vh);  left: 12%; top: 6%;  }
  .c-uno     { width: min(86px, 11vh);  left: 5%;  top: 46%; animation-delay: -2s; }
  .c-cuatro  { width: min(104px, 13vh); right: 10%; top: 10%; animation-delay: -4s; }
  .c-colores { width: min(104px, 13vh); right: 5%;  top: 48%; animation-delay: -1s; }

  @keyframes flotar {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-10px) rotate(2deg); }
  }

  /* ---------------- DESTELLOS ---------------- */
  .destello {
    position: absolute;
    width: 26px;
    height: 26px;
    color: var(--violeta);
    animation: titilar 3.2s ease-in-out infinite;
  }

  @keyframes titilar {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.45; transform: scale(0.8); }
  }

  /* ---------------- EL BOTON ---------------- */
  .accion {
    position: relative;
    z-index: 2;
    margin-top: 4px;
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 0 16px;
  }

  .boton {
    position: relative;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 320px;
    padding: clamp(14px, 2.4vh, 20px) 28px;
    border-radius: 999px;
    background: var(--lima);
    color: var(--tinta-oscura);
    font-weight: 800;
    font-size: 17px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    text-decoration: none;
    box-shadow: 0 0 0 0 rgba(217, 244, 90, 0.55), 0 12px 30px rgba(217, 244, 90, 0.18);
    animation: latir 2.4s ease-out infinite;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  /* El reflejo que cruza el boton, como en la referencia. */
  .boton::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    width: 60px;
    left: -80px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
    animation: reflejo 3s ease-in-out infinite;
  }

  .boton:hover { background: var(--lima-brillo); transform: translateY(-2px); }

  .boton:focus-visible { outline: 3px solid var(--violeta); outline-offset: 4px; }

  @keyframes latir {
    0%   { box-shadow: 0 0 0 0 rgba(217, 244, 90, 0.5), 0 12px 30px rgba(217, 244, 90, 0.18); }
    70%  { box-shadow: 0 0 0 16px rgba(217, 244, 90, 0), 0 12px 30px rgba(217, 244, 90, 0.18); }
    100% { box-shadow: 0 0 0 0 rgba(217, 244, 90, 0), 0 12px 30px rgba(217, 244, 90, 0.18); }
  }

  @keyframes reflejo {
    0%, 55% { left: -80px; }
    100%    { left: calc(100% + 20px); }
  }

  .subtitulo {
    margin: 18px 0 0;
    padding: 0 16px;
    text-align: center;
    color: rgba(244, 241, 246, 0.72);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.02em;
  }

  .subtitulo strong { color: var(--lima); font-weight: 800; }

  /* ---------------- LAS TRES CARTAS DE ABAJO ----------------
     Cartas sueltas y no una sola imagen: asi cada una tiene su borde
     limpio y no quedan pegadas entre si. */
  .abanico {
    position: relative;
    flex: none;
    height: min(230px, 25vh);
    height: min(230px, 25dvh);
    aspect-ratio: 1.6;
    max-width: 92vw;
    margin: clamp(10px, 3vh, 30px) 0 clamp(12px, 3vh, 28px);
  }

  .abanico > * {
    position: absolute;
    bottom: 0;
    left: 50%;
    height: 90%;
    width: auto;
    aspect-ratio: 0.69;
    filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.45));
  }

  .abanico .izq { bottom: 10%; transform: translateX(-100%) rotate(-16deg); transform-origin: bottom right; }
  .abanico .der { bottom: 10%; transform: translateX(0) rotate(16deg); transform-origin: bottom left; }

  .dorso {
    z-index: 1;
    bottom: 6%;
    transform: translateX(-50%);
    border-radius: 9%/6%;
    border: 4px solid #fff;
    background: var(--fondo);
    display: grid;
    place-items: center;
  }

  .dorso img { width: 82%; height: auto; display: block; }

  @media (prefers-reduced-motion: reduce) {
    .carta, .destello, .boton, .boton::after { animation: none; }
  }

  /* ---------------- EN EL TELEFONO ---------------- */
  @media (max-width: 600px) {
    .arriba { height: 330px; margin-top: 10px; }
    .solo-desktop { display: none; }
    .logo { width: 210px; }
    .c-seis    { width: 72px; left: 4%;  top: 10px; }
    .c-uno     { width: 64px; left: 2%;  top: 200px; }
    .c-cuatro  { width: 76px; right: 3%; top: 24px; }
    .c-colores { width: 76px; right: 2%; top: 200px; }
  }
</style>
